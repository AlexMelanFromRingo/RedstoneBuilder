[workspace]
resolver = "2"
members = [
    "crates/rb-core",
    "crates/rb-parser",
    "crates/rb-synthesis",
    "crates/rb-nbt",
    "crates/rb-stubs",
    "crates/redstonebuilder",
]

[workspace.package]
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alex-melan/RedstoneBuilder"
authors = ["Alex Melan"]

[workspace.dependencies]
# In-workspace crates
rb-core = { path = "crates/rb-core" }
rb-parser = { path = "crates/rb-parser" }
rb-synthesis = { path = "crates/rb-synthesis" }
rb-nbt = { path = "crates/rb-nbt" }
rb-stubs = { path = "crates/rb-stubs" }

# Third-party (versions pinned per plan.md §Primary Dependencies)
clap = { version = "4", features = ["derive"] }
thiserror = "1"
miette = "7"
pest = "2"
pest_derive = "2"
smol_str = { version = "0.2", features = ["serde"] }
petgraph = { version = "0.6", features = ["serde-1"] }
rand_chacha = "0.3"
memory-stats = "1"
rayon = "1"
fastnbt = "2"
flate2 = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
criterion = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Constitution Principle I: no panics on input-reachable paths.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
