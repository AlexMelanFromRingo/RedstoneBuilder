name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Run lib/bin/integration tests + compile examples. Benches are
      # NOT run here: criterion benches execute their harness under
      # `cargo test --all-targets`, and the heavy 10k-gate benches are
      # manual/nightly only — they are merely compiled in the step
      # below.
      - name: cargo test
        run: cargo test --workspace --lib --bins --tests --examples

      - name: cargo bench --no-run
        run: cargo bench --workspace --no-run
