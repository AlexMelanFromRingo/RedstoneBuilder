[package]
name = "redstonebuilder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Compile a Verilog-subset HDL to a Minecraft .litematic schematic."
keywords = ["minecraft", "redstone", "hdl", "verilog", "compiler"]
categories = ["command-line-utilities", "compilers"]

[[bin]]
name = "redstonebuilder"
path = "src/main.rs"

[dependencies]
rb-core = { workspace = true }
rb-parser = { workspace = true }
rb-synthesis = { workspace = true }
rb-nbt = { workspace = true }
petgraph = { workspace = true }
clap = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
